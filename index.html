<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor Desktop</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="fondo aplicacion">
  <div class="tarjeta flotante" id="visor principal">
    <div class="bloque cabecera" id="barra arrastre">
      <div class="zona estado">
        <span class="etiqueta estado" id="estado visor">Listo para captura</span>
        <span class="etiqueta proteccion">Oculto en transmision</span>
        <span class="etiqueta ciudad">Bogota</span>
      </div>
      <div class="zona controles">
        <button class="boton icono" id="boton panel ajustes">Ajustes</button>
        <button class="boton cerrar" id="boton cerrar ventana">x</button>
      </div>
    </div>

    <div class="bloque ajustes" id="area ajustes">
      <span class="etiqueta seccion">Claves de inteligencia artificial</span>
      <label for="campo clave gemini" class="etiqueta campo">Clave privada de Gemini</label>
      <input type="password" id="campo clave gemini" class="campo texto" placeholder="Pegue aqui su clave de Gemini">
      <label for="campo clave claude" class="etiqueta campo">Clave privada de Claude</label>
      <input type="password" id="campo clave claude" class="campo texto" placeholder="Pegue aqui su clave de Claude">
      <button class="boton accion boton guardar" id="boton guardar claves">Guardar claves</button>
    </div>

    <div class="bloque contenido">
      <div class="texto ayuda" id="texto orientacion">
        De clic en el boton o presione Alt y Espacio para capturar la ventana activa en este computador.
      </div>

      <div class="bloque visual" id="area visual">
        <video id="lienzo video" class="vista oculta" autoplay muted playsinline></video>
        <canvas id="lienzo seleccion" class="lienzo interactivo"></canvas>
      </div>

      <div class="bloque pregunta" id="area pregunta">
        <label for="campo consulta" class="etiqueta campo">Pregunta sobre el recuadro seleccionado</label>
        <div class="fila entrada">
          <input type="text" id="campo consulta" class="campo texto" placeholder="Escriba su consulta aqui">
          <button class="boton accion boton enviar" id="boton consultar">Consultar</button>
        </div>
      </div>

      <div class="caja respuesta" id="caja solucion">
        <p class="texto resultado" id="texto prediccion">Esperando orden de captura del usuario.</p>
      </div>

      <div class="bloque historial">
        <span class="etiqueta seccion">Historial reciente</span>
        <div class="caja historial" id="listado historial"></div>
      </div>
    </div>

    <div class="bloque acciones">
      <button class="boton accion boton captura" id="boton capturar">Capturar pantalla</button>
      <button class="boton accion boton copiar" id="boton copiar">Copiar solucion</button>
    </div>
  </div>

  <script src="conexion modelos.js"></script>
  <script src="recorte visual.js"></script>
  <script src="captura ventana.js"></script>
  <script src="enrutador logico.js"></script>
  <script src="historial local.js"></script>
  <script src="script.js"></script>
</body>
</html>
